<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iPhone milik Karin</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica}
  body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh}
  .iphone{width:390px;height:844px;background:#fff;border-radius:50px;overflow:hidden;position:relative;border:10px solid #1a1a1a;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:160px;height:30px;background:#1a1a1a;border-radius:0 0 20px 20px;z-index:10}
  .status{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;font-size:15px;font-weight:600;padding-top:10px}
  .header{height:95px;background:#f6f6f6;border-bottom:1px solid #e5e5e5;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  .header .back{position:absolute;left:15px;top:50%;color:#0a84ff;font-size:17px}
  .header .name{font-family:"Times New Roman",serif;font-size:28px;font-weight:400;margin-top:10px}
  .header .sub{font-size:12px;color:#8e8e93;margin-top:2px}
  #chat{height:calc(100% - 149px);overflow-y:auto;padding:15px 12px 20px;background:#fff;display:flex;flex-direction:column;gap:6px}
  .row{display:flex;width:100%}
  .row.me{justify-content:flex-end}
  .row.them{justify-content:flex-start}
  .bubble{max-width:74%;padding:9px 14px;border-radius:18px;font-size:17px;line-height:21px;word-wrap:break-word}
  .me .bubble{background:#0a84ff;color:#fff;border-bottom-right-radius:5px}
  .them .bubble{background:#e9e9eb;color:#000;border-bottom-left-radius:5px}
  .typing{width:65px;height:32px;background:#e9e9eb;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:4px}
  .dot{width:7px;height:7px;background:#8e8e93;border-radius:50%;animation:bounce 1.4s infinite}
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
</style>
</head>
<body>
<div class="iphone">
  <div class="notch"></div>
  <div class="status"><span>10:29</span><span>🔋</span></div>
  <div class="header">
    <span class="back">‹ Pesan</span>
    <div class="name">Rens ❤️</div>
    <div class="sub">iMessage</div>
  </div>
  <div id="chat"></div>
</div>
<script>
const messages=[
  {me:0,t:"lu dimana sih??"},
  {me:1,t:"main terus, gw nya kapan?"},
  {me:0,t:"lagi main bentar"},
  {me:1,t:"kaga ngambek, kesel"},
  {me:0,t:"ngambek lagi?"},
  {me:1,t:"maaf doang? kaga ada usahanya"},
  {me:0,t:"yaudah sayang maaf yaa"},
  {me:1,t:"terserah lu"},
  {me:0,t:"terus gw harus gimana sayang?"},
  {me:1,t:"lu kesini"},
  {me:0,t:"otw, tunggu ya sayang gw"},
  {me:1,t:"jan lama-lama, kangen"},
];
const chat=document.getElementById('chat');
let i=0;
function addMsg(m){
  const row=document.createElement('div');
  row.className='row '+(m.me?'me':'them');
  row.innerHTML=`<div class="bubble">${m.t}</div>`;
  chat.appendChild(row);
  chat.scrollTop=chat.scrollHeight;
}
function showTyping(){
  const row=document.createElement('div');
  row.className='row them'; row.id='typing';
  row.innerHTML='<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  chat.appendChild(row); chat.scrollTop=chat.scrollHeight;
}
function next(){
  if(i>=messages.length)return;
  showTyping();
  setTimeout(()=>{
    document.getElementById('typing')?.remove();
    addMsg(messages[i]); i++;
    setTimeout(next, 900 + Math.random()*600);
  }, 800 + Math.random()*700);
}
setTimeout(next,1000);
</script>
</body>
</html>
