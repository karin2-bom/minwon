<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karin</title>
<style>
body{background:#000;display:flex;justify-content:center;margin:0;min-height:100vh}
.iphone{width:390px;height:844px;background:#fff;border-radius:40px;overflow:hidden;border:8px solid #111}
.status{display:flex;justify-content:space-between;padding:14px 28px 0;font-weight:600}
.header{background:#f6f6f6;padding:18px;text-align:center;border-bottom:1px solid #ddd}
.name{font-size:26px;font-family:serif}
#chat{padding:14px;display:flex;flex-direction:column;gap:8px;height:680px;overflow:auto}
.bubble{max-width:75%;padding:10px 14px;border-radius:18px}
.me0{align-self:flex-start;background:#e9e9eb}
.me1{align-self:flex-end;background:#0a84ff;color:#fff}
</style>
</head>
<body>
<div class="iphone">
<div class="status"><span>09:41</span><span>🔋</span></div>
<div class="header"><div class="name">Karin</div><div style="font-size:12px;color:gray">iMessage</div></div>
<div id="chat"></div>
</div>
<script>
const m=[
  {me:0,t:"lu dimana sih??"},
  {me:1,t:"main terus, gw nya kapan?"},
  {me:0,t:"lagi main bentar"},
  {me:1,t:"kaga ngambek, kesel"},
  {me:0,t:"ngambek lagi?"},
  {me:1,t:"maaf doang? kaga ada usahanya"},
  {me:0,t:"yaudah sayang maaf yaa"},
  {me:1,t:"terserah lu"},
  {me:0,t:"terus gw harus gimana sayang?"},
  {me:1,t:"lu kesini"},
  {me:0,t:"otw, tunggu ya sayang gw"},
  {me:1,t:"jan lama-lama, kangen"},
];
const c=document.getElementById('chat');
m.forEach((x,i)=>setTimeout(()=>{
let b=document.createElement('div');
b.className='bubble me'+x.me;
b.textContent=x.t;
c.appendChild(b);
},i*700));
</script>
</body>
</html>
