{t:"RESEP IGA BAKAR & SOP IGA",d:1,tm:"21:40",b:`BIKIN AGAK PEDES BUAT KAKAK CANTIK 🌶️

IGA BAKAR (2 porsi, kakak pasti nambah)
* 1 kg iga sapi, potong per tulang
* 6 bawang merah, 5 bawang putih, jahe 2 cm
* 3 sdm kecap manis + 2 sdm kecap asin
* 1 sdm gochujang (RAHASIA, jangan kasih tau siapa siapa)
* 2 sdm madu
* 5 cabe rawit. Jangan lebih, nanti hidung kakak merah (lucu sih tapi kasian)

Cara:
> Rebus iga 1,5 jam sampe empuk. AIR REBUSANNYA JANGAN DIBUANG!!
> Ulek bawang, cabe, jahe, campur kecap + gochujang + madu
> Lumurin iga, diemin 30 menit sambil beresin dapur
> Bakar di teflon panggang, olesin bumbu bolak balik sampe karamel

SOP IGA
> Kaldu rebusan iga + wortel, kentang, daun bawang
> Bawang putih goreng yang BANYAK
> Seledri iris tipis tipis, kakak ga suka yang gede
> Kasih jeruk nipis, sambel rawit dipisah

Sajikan pake nasi anget + senyum ganteng 😎`},

function monthView(Y,M){const p=pgEl(" cal"),T=now();let yr=Y;
 p.innerHTML=`<div class="ct"><span id="cbk">${CI.b}<b style="font-weight:400" id="cyl">${Y}</b></span>${CI.l}${CI.s}${CI.p}</div><div class="wk">${"SMTWTFS".split("").map(x=>`<span>${x}</span>`).join("")}</div><div class="sc"></div><div class="cbar"><u id="ctd">Today</u><u>Calendars</u><u>Inbox</u></div>`;
 const sc=p.querySelector(".sc");
 const month=k=>{const y=Math.floor(k/12),m=((k%12)+12)%12,c=y==T.y&&m==T.m,f=fd(y,m),e=h("div","mb"+(c?" cur":""));e.dataset.k=k;e.dataset.y=y;
  const hd=h("h3","",`<span>${MN[m]}</span>`);hd.style.gridColumn=`${f+1} / 8`;hd.style.setProperty("--n",7-f);e.append(hd);
  for(let i=0;i<f;i++)e.append(h("i","e"));for(let i=1;i<=dim(y,m);i++){const w=(f+i-1)%7,ds=`${y}-${String(m+1).padStart(2,"0")}-${String(i).padStart(2,"0")}`,ev=CALEV.filter(x=>x.d==ds);
   const cell=h("i",(w==0?"sun ":"")+(c&&i==T.d?"td":"")+(ev.length?" hev":""),`<em>${i}</em>${ev.map(x=>`<span class="evc" style="--ec:${x.col}">${esc(tr(x.t))}</span>`).join("")}`);if(ev.length)cell.onclick=()=>calEvent(ev[0],y,m);e.append(cell)}return e};
 const k0=Y*12+M;infinite(sc,month,k0-6,k0+6,k0);
 sc.addEventListener("scroll",()=>{const top=sc.getBoundingClientRect().top+40;for(const e of sc.children){if(e.getBoundingClientRect().bottom>top){if(+e.dataset.y!=yr){yr=+e.dataset.y;$("#cyl").textContent=yr}break}}},{passive:true});
 $("#cbk").onclick=()=>calendar(yr);$("#ctd").onclick=()=>monthView(T.y,T.m)}

const nDate=n=>{const T=now(),d=new Date(T.y,T.m,T.d-n.d);return d};
function nWhen(n){const d=nDate(n);if(n.d==0){const[H,M]=n.tm.split(":");return((+H%12)||12)+":"+M+(+H<12?" AM":" PM")}if(n.d==1)return"Yesterday";if(n.d<7)return d.toLocaleDateString("en-US",{weekday:"long"});return`${d.getDate()}/${d.getMonth()+1}/${String(d.getFullYear()).slice(2)}`}
function nSec(n){if(n.d==0)return"Today";if(n.d==1)return"Yesterday";if(n.d<=7)return"Previous 7 Days";if(n.d<=30)return"Previous 30 Days";const d=nDate(n);return d.toLocaleDateString("en-US",{month:"long"})}

(()=>{const at=$("#at");let sx,sy,ox,oy,moved=false,down=false;
 at.onpointerdown=e=>{down=true;moved=false;at.setPointerCapture(e.pointerId);const r=at.getBoundingClientRect(),pr=scr.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=(r.left-pr.left)/K;oy=(r.top-pr.top)/K;at.classList.add("drag");at.style.transition="opacity .2s"};
 at.onpointermove=e=>{if(!down)return;const dx=(e.clientX-sx)/K,dy=(e.clientY-sy)/K;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(!moved)return;const W=scr.clientWidth,H=scr.clientHeight;at.style.right="auto";at.style.left=Math.max(4,Math.min(W-58,ox+dx))+"px";at.style.top=Math.max(50,Math.min(H-90,oy+dy))+"px"};
 at.onpointerup=e=>{if(!down)return;down=false;at.classList.remove("drag");at.style.transition="";if(!moved){lockNow();return}const W=scr.clientWidth,l=parseFloat(at.style.left);at.style.left=(l+27<W/2?10:W-64)+"px"}})();
